apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: {{ .Values.otelCollector.name }}
  namespace: {{ .Values.otelCollector.namespace }}
spec:
  mode: deployment
  observability:
    metrics:
      enableMetrics: true
  config:
    extensions:
      bearertokenauth:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 2s
        limit_mib: 400
        spike_limit_mib: 100
    exporters:
      otlphttp/tempo:
        endpoint: https://tempo-{{ .Values.tempo.name }}-gateway.{{ .Values.tempo.namespace }}.svc.cluster.local:8080/api/traces/v1/{{ .Values.tempo.tenant }}
        tls:
          insecure: false
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        auth:
          authenticator: bearertokenauth
        headers:
          X-Scope-OrgID: {{ .Values.tempo.tenant }}
    service:
      extensions: [bearertokenauth]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/tempo]
