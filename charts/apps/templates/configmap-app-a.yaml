apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appA.name }}-nginx-config
  namespace: {{ .Values.namespace }}
data:
  default.conf: |
    server {
        listen {{ .Values.appA.port }};
        server_name _;

        location / {
            default_type text/html;
            return 200 '<!DOCTYPE html>
            <html><head><title>App A - Frontend</title></head>
            <body>
            <h1>App A - Service Mesh 3 PoC Frontend</h1>
            <p>Ambient Mode with Waypoint L7 Routing</p>
            <ul>
              <li><a href="/app-b">Call App B (via waypoint routing)</a></li>
              <li><a href="/app-c">Call App C (via waypoint routing)</a></li>
            </ul>
            </body></html>';
        }

        location /app-b {
            proxy_pass http://{{ .Values.backend.name }}:{{ .Values.backend.port }};
            proxy_http_version 1.1;
            proxy_set_header Host {{ .Values.backend.name }};
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header tracestate $http_tracestate;
            proxy_set_header x-request-id $http_x_request_id;
            proxy_set_header x-b3-traceid $http_x_b3_traceid;
            proxy_set_header x-b3-spanid $http_x_b3_spanid;
            proxy_set_header x-b3-parentspanid $http_x_b3_parentspanid;
            proxy_set_header x-b3-sampled $http_x_b3_sampled;
            proxy_set_header x-b3-flags $http_x_b3_flags;
        }

        location /app-c {
            proxy_pass http://{{ .Values.backend.name }}:{{ .Values.backend.port }};
            proxy_http_version 1.1;
            proxy_set_header Host {{ .Values.backend.name }};
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header traceparent $http_traceparent;
            proxy_set_header tracestate $http_tracestate;
            proxy_set_header x-request-id $http_x_request_id;
            proxy_set_header x-b3-traceid $http_x_b3_traceid;
            proxy_set_header x-b3-spanid $http_x_b3_spanid;
            proxy_set_header x-b3-parentspanid $http_x_b3_parentspanid;
            proxy_set_header x-b3-sampled $http_x_b3_sampled;
            proxy_set_header x-b3-flags $http_x_b3_flags;
        }

        location /healthz {
            access_log off;
            return 200 'ok';
            default_type text/plain;
        }
    }
