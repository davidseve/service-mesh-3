apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.appA.name }}
  namespace: {{ .Values.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appA.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appA.name }}
    version: {{ .Values.version }}
spec:
  replicas: {{ .Values.appA.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.appA.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.appA.name }}
        version: {{ .Values.version }}
    spec:
      serviceAccountName: {{ .Values.appA.name }}
      containers:
      - name: nginx
        image: {{ .Values.image }}
        ports:
        - containerPort: {{ .Values.appA.port }}
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        {{- if .Values.probes.enabled }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.appA.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.appA.port }}
          initialDelaySeconds: 3
          periodSeconds: 5
        {{- end }}
      volumes:
      - name: nginx-config
        configMap:
          name: {{ .Values.appA.name }}-nginx-config
---
# app-a does NOT need a waypoint for routing or policy (it has no HTTPRoute or L7 AuthorizationPolicy).
# The use-waypoint label is added solely so the waypoint generates a tracing span for inbound
# traffic to app-a, enabling end-to-end trace correlation in Tempo (gateway -> waypoint -> app-a -> backend).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appA.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appA.name }}
    version: {{ .Values.version }}
    istio.io/use-waypoint: {{ .Values.waypoint.name }}
spec:
  selector:
    app: {{ .Values.appA.name }}
  ports:
  - port: {{ .Values.appA.port }}
    targetPort: {{ .Values.appA.port }}
    name: http
