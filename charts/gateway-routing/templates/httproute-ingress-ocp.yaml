# Binds the OCP Gateway listener to a backend. Same rationale as ingress-aws:
# Gateway API requires an HTTPRoute to know where to send traffic.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ingress-ocp
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - name: {{ .Values.gatewayOCP.name }}
    namespace: {{ .Values.namespace }}
  rules:
  - backendRefs:
    - name: {{ .Values.appA.name }}
      port: {{ .Values.appA.port }}
