# Mesh-internal L7 routing through the waypoint. parentRef targets the virtual "backend"
# Service so the waypoint evaluates these rules when traffic arrives for backend:8080.
# The RequestHeaderModifier filters inject headers that the backend apps echo back in
# their JSON response, allowing e2e tests to verify traffic actually traversed the waypoint.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mesh-routing
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: {{ .Values.backend.name }}
    port: {{ .Values.backend.port }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /app-b
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: x-routed-by
          value: sm3-waypoint
        - name: x-destination
          value: app-b
        set:
        - name: x-mesh-trace-id
          value: poc-trace-app-b
    backendRefs:
    - name: {{ .Values.appB.name }}
      port: {{ .Values.appB.port }}
  - matches:
    - path:
        type: PathPrefix
        value: /app-c
    filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: x-routed-by
          value: sm3-waypoint
        - name: x-destination
          value: app-c
        set:
        - name: x-mesh-trace-id
          value: poc-trace-app-c
    backendRefs:
    - name: {{ .Values.appC.name }}
      port: {{ .Values.appC.port }}
