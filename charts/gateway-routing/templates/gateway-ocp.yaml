# Ingress Gateway exposed via ClusterIP (fronted by an OCP Route for external access).
# An HTTPRoute must be attached to define where traffic goes.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gatewayOCP.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
