---
# Source: control-plane/templates/namespace-istio-cni.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: istio-cni
  labels:
    istio-discovery: enabled
---
# Source: control-plane/templates/namespace-istio-system.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
  labels:
    istio-discovery: enabled
---
# Source: control-plane/templates/namespace-ztunnel.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: ztunnel
  labels:
    istio-discovery: enabled
---
# Source: control-plane/templates/istio.yaml
apiVersion: sailoperator.io/v1
kind: Istio
metadata:
  name: default
spec:
  namespace: istio-system
  # Activates ambient mode in istiod (enables HBONE, waypoint support, ztunnel coordination).
  profile: ambient
  # Required by the CRD. The -latest alias auto-receives patch upgrades within this minor.
  version: v1.30-latest
  # InPlace: single control plane instance updated in-situ. Recommended for ambient mode
  # because there are no sidecars requiring revision-based canary upgrades.
  updateStrategy:
    type: InPlace
  values:
    pilot:
      trustedZtunnelNamespace: ztunnel
    meshConfig:
      enableTracing: true
      defaultConfig:
        tracing:
          sampling: 100
      defaultProviders:
        tracing:
        - otel
      # Registers the OTEL Collector as the trace export destination (gRPC port 4317).
      # Without this, waypoints do not emit traces even if the Collector is deployed.
      extensionProviders:
      - name: otel
        opentelemetry:
          port: 4317
          service: otel-collector-collector.istio-system.svc.cluster.local
      # Limits which namespaces istiod watches. Only namespaces with this label
      # are part of the mesh, reducing control plane load on large clusters.
      discoverySelectors:
      - matchLabels:
          istio-discovery: enabled
---
# Source: control-plane/templates/istiocni.yaml
# IstioCNI intercepts traffic at the node level and redirects it to ztunnel.
# In ambient mode (profile: ambient), it configures iptables/nftables rules per pod
# without requiring sidecar injection.
apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  name: default
spec:
  namespace: istio-cni
  version: v1.30-latest
  profile: ambient
---
# Source: control-plane/templates/ztunnel.yaml
# ZTunnel: per-node L4 proxy (DaemonSet). Handles mTLS (HBONE), L4 AuthorizationPolicy,
# and TCP metrics for all ambient-enrolled pods on the node.
apiVersion: sailoperator.io/v1
kind: ZTunnel
metadata:
  name: default
spec:
  namespace: ztunnel
  version: v1.30-latest
  values:
    ztunnel:
      # Grace period before SIGKILL during node drain/upgrades. Allows in-flight
      # connections to complete before the ztunnel pod terminates.
      terminationGracePeriodSeconds: 45
