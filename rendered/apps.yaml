# Source: apps/templates/traffic-generator.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: mesh-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      serviceAccountName: traffic-generator
      containers:
      - name: curl
        image: registry.access.redhat.com/ubi9/ubi-minimal:latest
        command:
        - /bin/sh
        - -c
        - |
          while true; do
            curl -s -o /dev/null -w "app-a: %{http_code}\n" http://app-a:8080/ 2>/dev/null || echo "app-a: connection failed"
            curl -s -o /dev/null -w "app-b-via-waypoint: %{http_code}\n" http://app-a:8080/app-b 2>/dev/null || echo "app-b: connection failed"
            curl -s -o /dev/null -w "app-c-via-waypoint: %{http_code}\n" http://app-a:8080/app-c 2>/dev/null || echo "app-c: connection failed"
            sleep 2
          done
