# Source: bookinfo/templates/waypoint.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: bookinfo
  labels:
    istio.io/waypoint-for: service
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
---
# Source: bookinfo/templates/traffic-split-reviews.yaml
# A single HTTPRoute is sufficient here because bookinfo only needs weight-based
# traffic splitting between versions (canary). No path matching, header routing, or
# multiple entry points are required -- just percentage distribution.
# The parentRef targets Service "reviews" so the waypoint applies this when traffic
# is destined to reviews:9080.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: reviews
  namespace: bookinfo
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: reviews
    port: 9080
  rules:
  - backendRefs:
    - name: reviews-v1
      port: 9080
      weight: 90
    - name: reviews-v2
      port: 9080
      weight: 10
